appId: org.unfoldingword.app
name: The three tabs Home, Study and Formation
---
- runFlow: common/start.yaml
- takeScreenshot: tabs-1-home
- tapOn: 'Study'
- extendedWaitUntil:
    visible: 'Library'
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: tabs-2-study
- tapOn: 'Formation'
- extendedWaitUntil:
    visible: 'Formation'
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: tabs-3-formation
- tapOn: 'Home'
- extendedWaitUntil:
    visible: 'Switch theme'
    timeout: 15000
- takeScreenshot: tabs-4-home-again
