appId: ${APP_ID}
name: English and the stories are ready offline on first launch, with no download
tags:
  - optional
---
- runFlow: common/start.yaml
- takeScreenshot: english-1-home
- extendedWaitUntil:
    visible: '[0-9]+ resources? ready offline in English'
    timeout: 300000
- assertNotVisible: 'Download English'
- takeScreenshot: english-2-ready
- tapOn: 'Study'
- extendedWaitUntil:
    visible: 'Next chapter'
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: english-3-study
