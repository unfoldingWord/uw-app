appId: org.unfoldingword.app
---
- launchApp:
    clearState: true
- tapOn:
    text: 'Allow'
    optional: true
- extendedWaitUntil:
    visible: 'Continue in English'
    timeout: 90000
- tapOn: 'Continue in English'
- extendedWaitUntil:
    visible: 'Switch theme'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
