appId: ${APP_ID}
name: Download another language from the catalog after English came with the app
tags:
  - optional
  - network
---
- runFlow: common/start.yaml
- extendedWaitUntil:
    visible: '[0-9]+ resources? ready offline in English'
    timeout: 300000
- tapOn: 'Change language, now .*'
- extendedWaitUntil:
    visible: 'Search languages'
    timeout: 60000
- tapOn: 'Search languages'
- inputText: 'Kiswahili'
- hideKeyboard
- takeScreenshot: download-1-search
- tapOn: 'Read in Kiswahili'
- extendedWaitUntil:
    visible: '[0-9]+ resources? ready offline in Kiswahili'
    timeout: 900000
- takeScreenshot: download-2-ready
