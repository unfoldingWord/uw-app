appId: ${APP_ID}
name: Settings switches the app to Arabic, the app reloads right to left, and Home and Study render mirrored
tags:
  - optional
  - rtl
---
- runFlow: common/start.yaml
- tapOn:
    text: 'Settings'
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: 'App language'
    timeout: 15000
- tapOn: 'App language'
- scrollUntilVisible:
    element: 'العربية'
    direction: DOWN
    timeout: 10000
- takeScreenshot: rtl-1-app-languages
- tapOn: 'العربية'
- extendedWaitUntil:
    visible: 'تبديل المظهر'
    timeout: 90000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: rtl-2-home-arabic
- tapOn: 'الدراسة'
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: rtl-3-study-arabic
- tapOn: 'التكوين'
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: rtl-4-formation-arabic
