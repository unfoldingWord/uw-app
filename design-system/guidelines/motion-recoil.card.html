<!-- @dsCard group="Motion" viewport="700x300" name="Recoil" subtitle="The press and its result are one motion — the surface squashes as it grows, and a single settle curve carries both" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box;margin:0}body{font-family:var(--font-core);background:var(--aurora-field);padding:22px;color:var(--ink-700);height:100vh;display:grid;grid-template-columns:1fr 250px;gap:26px;align-items:start}
.lb{font:var(--fw-medium) 10px/1 var(--font-core);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-500)}
.hx{font:11px/1.5 var(--font-core);color:var(--ink-500)}
.stage{display:flex;flex-direction:column;gap:12px}
.tile{width:210px;height:74px;border-radius:var(--r-xl);background:var(--material-card);backdrop-filter:blur(var(--blur-medium)) var(--sat-glass);border:var(--border-glass);box-shadow:var(--shadow-card),var(--inner-top);padding:16px 18px;cursor:pointer;transition:var(--t-recoil),height var(--dur-morph) var(--ease-settle) var(--delay-morph),width var(--dur-morph) var(--ease-settle) var(--delay-morph),box-shadow var(--dur-morph) var(--ease-settle) var(--delay-morph);overflow:hidden;will-change:transform,width,height}
.tile:active{transform:var(--recoil-squash)}
.tile.open{width:330px;height:150px;box-shadow:var(--shadow-float),var(--inner-top)}
.ttl{font:var(--fw-medium) 15px/1.2 var(--font-core);color:var(--ink-900)}
.sub{font:12px/1.4 var(--font-core);color:var(--ink-500);margin-top:4px}
.body{margin-top:14px;display:flex;gap:8px;opacity:0;transform:translateY(6px);transition:opacity var(--dur-base) var(--ease-settle) calc(var(--delay-morph) + 120ms),transform var(--dur-base) var(--ease-settle) calc(var(--delay-morph) + 120ms)}
.tile.open .body{opacity:1;transform:none}
.chip{padding:6px 11px;border-radius:var(--r-pill);background:var(--material-chip);border:var(--border-glass-soft);font:11px/1 var(--font-core);color:var(--ink-700);white-space:nowrap}
.bar{height:5px;border-radius:3px;background:rgba(255,255,255,.55);box-shadow:var(--inner-edge);position:relative;overflow:hidden}
.bar i{position:absolute;top:0;bottom:0;border-radius:3px;background:var(--uw-inspire)}
.row{display:grid;gap:5px;margin-bottom:14px}
.loop{width:56px;height:56px;border-radius:var(--r-md);background:var(--material-card);backdrop-filter:blur(var(--blur-soft)) var(--sat-glass);border:var(--border-glass);box-shadow:var(--shadow-card),var(--inner-top);animation:gg-recoil 2.6s var(--ease-settle) infinite}</style></head>
<body>
<div class="stage">
<div class="lb">Tap the tile</div>
<div class="tile" onclick="this.classList.toggle('open')"><div class="ttl">Kyoto</div><div class="sub">3 routes found</div><div class="body"><span class="chip">Rail · 2h 14m</span><span class="chip">Air · 1h 05m</span></div></div>
<div class="hx">--t-recoil and --dur-morph start on the same frame</div>
</div>
<div>
<div class="row"><div class="lb">0 – 110ms · squash and morph start together</div><div class="bar"><i style="left:0;width:9%"></i></div></div>
<div class="row"><div class="lb">0ms · no handoff, one curve</div><div class="bar"><i style="left:0;width:9%;opacity:.55"></i><i style="left:0;width:2%"></i></div></div>
<div class="row"><div class="lb">0 – 600ms · settle</div><div class="bar"><i style="left:0;width:100%"></i></div></div>
<div style="display:flex;align-items:center;gap:12px;margin-top:20px"><div class="loop"></div><div><div class="lb">gg-recoil</div><div class="hx">squash and rebound alone</div></div></div>
</div>
</body></html>
