<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box;margin:0}body{font-family:var(--font-core);background:var(--studio-bg);padding:20px;-webkit-font-smoothing:antialiased}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.lockup{display:flex;align-items:center;justify-content:center;height:88px;padding:12px 20px;border-radius:var(--r-lg);border:var(--border-glass-soft);position:relative;overflow:hidden;isolation:isolate}.bg{position:absolute;inset:0;z-index:0}.lockup img{max-height:52px;max-width:100%;object-fit:contain;position:relative;z-index:1}.caption{font:var(--fw-medium) 9px/1.3 var(--font-core);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-500);margin-top:6px}</style></head>
<body><div class="grid">
<div><div class="lockup"><div class="bg" style="background:var(--aurora-field)"></div><img src="../assets/logo/logo-horizontal-color.png" alt="Full colour on the aurora field"></div><div class="caption">Full colour · on aurora</div></div>
<div><div class="lockup"><div class="bg" style="background:var(--paper-100)"></div><img src="../assets/logo/logo-horizontal-color.png" alt="Full colour on paper"></div><div class="caption">Full colour · on paper</div></div>
<div><div class="lockup" data-theme="dark"><div class="bg" style="background:var(--aurora-field)"></div><img src="../assets/logo/logo-horizontal-reversed.png" alt="Reversed on the dark aurora field"></div><div class="caption">Reversed · on dark aurora</div></div>
<div><div class="lockup"><div class="bg" style="background:var(--uw-ocean)"></div><img src="../assets/logo/logo-horizontal-white.png" alt="White on Ocean"></div><div class="caption">White · on Ocean</div></div>
</div></body></html>
