<!doctype html><html><head><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box;margin:0}body{font-family:var(--font-core);background:var(--studio-bg);padding:20px;color:var(--ink-900);-webkit-font-smoothing:antialiased}.row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}.sw{border-radius:10px;height:56px;flex:1;min-width:0;box-shadow:var(--shadow-rest)}.lb{font:var(--fw-medium) 9px/1.3 var(--font-core);color:var(--ink-500);margin-top:6px;letter-spacing:.02em}.hx{font:var(--fw-regular) 9px/1.3 var(--font-mono);color:var(--ink-300)}</style></head><body><div class="row"><div style="flex:1"><div class="sw" style="background:var(--accent-blue)"></div><div class="lb">blue · seat badge (Inspire)</div><div class="hx">#31ADE3</div></div><div style="flex:1"><div class="sw" style="background:var(--accent-deep)"></div><div class="lb">deep · links, avatar (Ocean)</div><div class="hx">#014263</div></div><div style="flex:1"><div class="sw" style="background:var(--accent-teal)"></div><div class="lb">teal · map glow (Cultivate)</div><div class="hx">#70C9CC</div></div><div style="flex:1"><div class="sw" style="background:var(--accent-warm)"></div><div class="lb">warm · active pin (Kindle)</div><div class="hx">#E59D33</div></div></div></body></html>
