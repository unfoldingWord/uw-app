<!doctype html><html><head><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box;margin:0}body{font-family:var(--font-core);background:var(--studio-bg);padding:20px;color:var(--ink-900);-webkit-font-smoothing:antialiased;height:190px}
.row{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;height:100%}
.sw{border-radius:var(--r-md);padding:10px;display:flex;flex-direction:column;justify-content:flex-end;box-shadow:var(--shadow-rest)}
.n{font:var(--fw-semibold) 12px/1.2 var(--font-core)}
.h{font:var(--fw-regular) 10px/1.4 var(--font-mono)}
.p{font:var(--fw-regular) 9px/1.5 var(--font-core);margin-top:4px}
.star{font:var(--fw-semibold) 9px/1 var(--font-core);letter-spacing:.1em;text-transform:uppercase;margin-bottom:auto}</style></head>
<body><div class="row">
<div class="sw" style="background:var(--uw-inspire);color:#04222F"><div class="star">Primary</div><div class="n">Inspire</div><div class="h">#31ADE3</div><div class="p">PANTONE 298 C<br>68 / 13 / 0 / 0</div></div>
<div class="sw" style="background:var(--uw-ocean);color:#CFE6F2"><div class="n">Ocean</div><div class="h">#014263</div><div class="p">PANTONE 7694 C<br>100 / 73 / 38 / 26</div></div>
<div class="sw" style="background:var(--uw-tech);color:#D8D6D6"><div class="n">Tech</div><div class="h">#231F20</div><div class="p">PANTONE Neutral Black C<br>70 / 67 / 64 / 74</div></div>
<div class="sw" style="background:var(--uw-cultivate);color:#0B3A3B"><div class="n">Cultivate</div><div class="h">#70C9CC</div><div class="p">PANTONE 630 C<br>53 / 0 / 22 / 0</div></div>
<div class="sw" style="background:var(--uw-kindle);color:#40270A"><div class="n">Kindle</div><div class="h">#E59D33</div><div class="p">PANTONE 7563 C<br>9 / 42 / 92 / 0</div></div>
</div></body></html>
