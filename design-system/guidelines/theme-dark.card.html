<!-- @dsCard group="Colors" viewport="700x150" name="Dark theme surfaces" subtitle="data-theme=&quot;dark&quot; re-points every semantic alias — base palette untouched" -->
<!doctype html><html><head><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box;margin:0}body{font-family:var(--font-core);background:var(--studio-bg);padding:0;color:var(--text-body);height:150px;display:grid;grid-template-columns:1fr 1fr}.pane{padding:18px;display:grid;align-content:center;gap:10px;background:var(--surface-app)}.row{display:flex;gap:8px}.sw{flex:1;height:38px;border-radius:var(--r-md);border:var(--border-glass);box-shadow:var(--shadow-rest),var(--inner-top);display:grid;place-items:center;font:var(--fw-medium) 9px/1 var(--font-core);color:var(--text-muted)}.hx{font:var(--fw-medium) 9px/1 var(--font-core);letter-spacing:.08em;text-transform:uppercase;color:var(--text-faint)}</style></head>
<body>
<div class="pane"><div class="hx">Light</div><div class="row"><div class="sw" style="background:var(--glass-fill-1)">1</div><div class="sw" style="background:var(--glass-fill-2)">2</div><div class="sw" style="background:var(--glass-fill-3)">3</div><div class="sw" style="background:var(--glass-fill-4)">4</div></div><div style="font:var(--type-caption);color:var(--text-muted)">Title, body and muted ink</div></div>
<div class="pane" data-theme="dark"><div class="hx">Dark</div><div class="row"><div class="sw" style="background:var(--glass-fill-1)">1</div><div class="sw" style="background:var(--glass-fill-2)">2</div><div class="sw" style="background:var(--glass-fill-3)">3</div><div class="sw" style="background:var(--glass-fill-4)">4</div></div><div style="font:var(--type-caption);color:var(--text-muted)">Title, body and muted ink</div></div>
</body></html>
