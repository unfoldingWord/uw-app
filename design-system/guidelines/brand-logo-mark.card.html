<!-- @dsCard group="Brand" viewport="700x250" name="Logo · Mark + Vertical" subtitle="Mark-only and stacked lockup — the mark is the system's app icon" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box;margin:0}body{font-family:var(--font-core);background:var(--studio-bg);padding:20px;-webkit-font-smoothing:antialiased}.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}.lockup{display:flex;align-items:center;justify-content:center;height:172px;padding:20px;border-radius:var(--r-lg);border:var(--border-glass-soft);position:relative;overflow:hidden;isolation:isolate}.bg{position:absolute;inset:0;z-index:0}.plate{position:relative;z-index:1;display:grid;place-items:center;width:104px;height:104px;border-radius:var(--r-xl);background:var(--glass-fill-2);backdrop-filter:blur(var(--blur-strong)) var(--sat-glass);-webkit-backdrop-filter:blur(var(--blur-strong)) var(--sat-glass);border:var(--border-glass);box-shadow:var(--shadow-card),var(--inner-top)}.lockup img{max-height:100%;max-width:100%;object-fit:contain;position:relative;z-index:1}.plate img{width:58px;height:58px;object-fit:contain}.caption{font:var(--fw-medium) 9px/1.3 var(--font-core);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-500);margin-top:6px}</style></head>
<body><div class="grid">
<div><div class="lockup"><div class="bg" style="background:var(--aurora-field)"></div><img src="../assets/logo/logo-mark-color.png" alt="Brand mark" style="max-height:104px"></div><div class="caption">Brand mark</div></div>
<div><div class="lockup"><div class="bg" style="background:var(--aurora-field)"></div><img src="../assets/logo/logo-vertical-color.png" alt="Vertical lockup"></div><div class="caption">Vertical lockup</div></div>
<div><div class="lockup" data-theme="dark"><div class="bg" style="background:var(--aurora-field)"></div><div class="plate"><img src="../assets/logo/logo-mark-color.png" alt="Mark on a glass plate"></div></div><div class="caption">Mark · on glass</div></div>
</div></body></html>
