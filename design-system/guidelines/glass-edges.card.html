<!doctype html><html><head><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box;margin:0}body{font-family:var(--font-core);background:var(--studio-bg);padding:20px;color:var(--ink-900);-webkit-font-smoothing:antialiased}.row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}.sw{border-radius:10px;height:56px;flex:1;min-width:0;box-shadow:var(--shadow-rest)}.lb{font:var(--fw-medium) 9px/1.3 var(--font-core);color:var(--ink-500);margin-top:6px;letter-spacing:.02em}.hx{font:var(--fw-regular) 9px/1.3 var(--font-mono);color:var(--ink-300)}</style></head><body style="padding:0">
<div style="height:100%;background:var(--aurora-field);padding:20px;display:flex;gap:14px">

</div></body></html>
