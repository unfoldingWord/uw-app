<!doctype html><html><head><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box;margin:0}body{font-family:var(--font-core);background:var(--studio-bg);padding:20px;color:var(--ink-900);-webkit-font-smoothing:antialiased}.row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}.sw{border-radius:10px;height:56px;flex:1;min-width:0;box-shadow:var(--shadow-rest)}.lb{font:var(--fw-medium) 9px/1.3 var(--font-core);color:var(--ink-500);margin-top:6px;letter-spacing:.02em}.hx{font:var(--fw-regular) 9px/1.3 var(--font-mono);color:var(--ink-300)}</style></head><body>
<div class="row"><div style="text-align:center;flex:1"><div style="height:64px;border-radius:var(--r-key);background:var(--paper-000);box-shadow:var(--shadow-rest);border:var(--border-hairline)"></div><div class="lb">key</div><div class="hx">6</div></div><div style="text-align:center;flex:1"><div style="height:64px;border-radius:var(--r-xs);background:var(--paper-000);box-shadow:var(--shadow-rest);border:var(--border-hairline)"></div><div class="lb">xs</div><div class="hx">10</div></div><div style="text-align:center;flex:1"><div style="height:64px;border-radius:var(--r-sm);background:var(--paper-000);box-shadow:var(--shadow-rest);border:var(--border-hairline)"></div><div class="lb">sm</div><div class="hx">14</div></div><div style="text-align:center;flex:1"><div style="height:64px;border-radius:var(--r-md);background:var(--paper-000);box-shadow:var(--shadow-rest);border:var(--border-hairline)"></div><div class="lb">md</div><div class="hx">18</div></div><div style="text-align:center;flex:1"><div style="height:64px;border-radius:var(--r-lg);background:var(--paper-000);box-shadow:var(--shadow-rest);border:var(--border-hairline)"></div><div class="lb">lg</div><div class="hx">22</div></div><div style="text-align:center;flex:1"><div style="height:64px;border-radius:var(--r-xl);background:var(--paper-000);box-shadow:var(--shadow-rest);border:var(--border-hairline)"></div><div class="lb">xl</div><div class="hx">28</div></div><div style="text-align:center;flex:1"><div style="height:64px;border-radius:var(--r-2xl);background:var(--paper-000);box-shadow:var(--shadow-rest);border:var(--border-hairline)"></div><div class="lb">2xl</div><div class="hx">34</div></div><div style="text-align:center;flex:1"><div style="height:64px;border-radius:var(--r-pill);background:var(--paper-000);box-shadow:var(--shadow-rest);border:var(--border-hairline)"></div><div class="lb">pill</div><div class="hx">999</div></div></div>
</body></html>
