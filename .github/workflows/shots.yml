name: shots

on:
  workflow_dispatch:
  pull_request:

jobs:
  shots:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright-core install chromium
      - run: npm run shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots
          path: |
            shots/*.png
            shots/*.html
            shots/report.json
          if-no-files-found: warn
